async function unlock(){
  const err=document.getElementById('err');err.textContent='decrypting\u2026';
  try{
    const raw=b(B64), salt=raw.slice(0,16), nonce=raw.slice(16,28), ct=raw.slice(28);
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
